name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (iOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        # swift-certificates 1.19.3+ needs Swift tools 6.1 (Xcode 16.3+), so pick
        # the newest installed Xcode 16.x rather than the default 16.0 symlink.
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"

      - name: Show environment
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -scheme IDVKit-Package

      - name: Build
        run: >
          xcodebuild build
          -scheme IDVKit
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro'

      - name: Test
        run: >
          xcodebuild test
          -scheme IDVKit-Package
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro'
          -resultBundlePath TestResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
